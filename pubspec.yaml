name: suki
description: "A new Flutter project."
publish_to: 'none'
version: 3.0.1+1
environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.12.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  http: ^1.2.2
  cached_network_image: ^3.4.1
  audioplayers: ^6.8.1
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  # 显式依赖只为拿到 ImageRenderMethodForWeb 枚举（见 lib/widgets/remote_image.dart）。
  # TODO(web): 与那里的 Flutter 3.47 web 图片黑块 workaround 一起删除。
  cached_network_image_platform_interface: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  # Adaptive icon (Android 8.0+)
  adaptive_icon_background: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  fonts:
    - family: IceMoon
      fonts:
        - asset: assets/ICE_MOON_FONTS.ttf
