<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Suki 排班">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="suki">
  <meta name="theme-color" content="#1f1338">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>suki</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #1f1338; }
    body { overflow: hidden; }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f4eeff;
      font-family: system-ui, sans-serif;
      letter-spacing: .18em;
      background: radial-gradient(circle at 50% 20%, #4a2f80, #1f1338 56%);
      transition: opacity .3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">排班加载中…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    const loading = document.getElementById('loading');
    const observer = new MutationObserver(() => {
      if (document.querySelector('flt-glass-pane')) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 320);
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
</body>
</html>
